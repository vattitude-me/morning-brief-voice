server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The shell, the service worker and the runtime config must never be cached.
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }
  location = /config.js {
    add_header Cache-Control "no-store";
  }

  # Static hosting: unknown paths fall back to the app shell.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
